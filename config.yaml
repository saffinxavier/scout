keywords:
  - java
  - spring boot
  - spring
  - springboot

exclude_levels:
  - intern
  - internship
  - graduate
  - campus
  - trainee
  - apprentice
  - student

# Drop postings whose stated minimum experience is above this (3.5y profile → 4).
max_years: 4

# Titles that usually imply 5–8+ years (India/EU). Infopark skips this gate.
exclude_seniority:
  - assistant vice president
  - vice president
  - principal engineer
  - staff engineer
  - architect
  - director

# Drop when these appear as degree requirements (see filters.requires_excluded_education).
exclude_education:
  - master's
  - masters
  - m.tech
  - mtech
  - mba
  - m.s
  - postgraduate
  - post-graduate

sponsorship_keywords:
  - visa
  - sponsorship
  - work permit
  - highly skilled migrant
  - kennismigrant
  - blue card
  - relocation
  - residence permit
  - sponsor

# Sources marked sponsorship_board: true skip keyword sponsorship checks (EU / UAE).
sources:
  # --- Infopark Kochi ---
  - id: infopark
    enabled: true
    region: infopark
    search_url: "https://infopark.in/companies-job"
    max_pages: 30

  # --- Europe sponsorship / relocation boards ---
  - id: relocate_me
    enabled: true
    region: eu
    sponsorship_board: true
    search_url: "https://relocate.me/international-jobs?query=java"
    max_pages: 10

  - id: welcome_nl
    enabled: false
    region: eu
    sponsorship_board: true
    company: Welcome to NL
    note: Official board currently lists 0 jobs
    search_url: "https://www.welcome-to-nl.nl/jobs/"

  - id: jaabz
    enabled: true
    region: eu
    sponsorship_board: true
    search_url: "https://jaabz.com/jobs?q=java+spring&visa=1"
    max_pages: 10

  # --- UAE (same Java / years / education / sponsorship gates as Europe) ---
  - id: relocate_me_uae
    enabled: true
    region: uae
    sponsorship_board: true
    country_slug: united-arab-emirates
    search_url: "https://relocate.me/united-arab-emirates"
    max_pages: 8

  - id: jaabz_uae
    enabled: true
    region: uae
    sponsorship_board: true
    search_url: "https://jaabz.com/jobs/in/united-arab-emirates/visasponsorship?q=java+spring"
    max_pages: 10

  - id: arbeitnow
    enabled: true
    region: eu
    sponsorship_board: false
    # Public EU job board API; sponsorship keyword still required.
    max_pages: 8

  - id: remotive
    enabled: true
    region: eu
    geo: eu
    sponsorship_board: true
    empty_ok: true
    note: "Remotive.com JSON is a 20-job teaser (search ignored; HTML/RSS Cloudflare). Adapter also reads Jobicy Java remote JSON; 0 means no Java+EU/worldwide titles today."

  # --- Remote (India-eligible: India / APAC / Asia / Worldwide; no visa gate) ---
  - id: remotive_remote
    enabled: true
    region: remote
    geo: india_eligible
    sponsorship_board: false
    empty_ok: true
    note: "Same Remotive+Jobicy JSON as remotive, geo=india_eligible instead of EU."

  - id: himalayas
    enabled: true
    region: remote
    sponsorship_board: false
    empty_ok: true
    max_pages: 4
    queries:
      - java
      - spring boot
    note: "Himalayas public jobs API; keeps India/APAC/worldwide locationRestrictions."

  # --- India Big 4 + banks ---
  - id: jpmorgan
    enabled: true
    region: india
    company: JPMorgan Chase
    keyword: Java

  - id: citi
    enabled: true
    region: india
    company: Citi
    keyword: Java
    # jobs.citi.com (Phenom). Workday CXS (citi.wd5) currently 303s to maintenance.

  - id: goldman_sachs
    enabled: false
    region: india
    company: Goldman Sachs
    note: HTML career site, no public API
    search_url: "https://higher.gs.com/roles?keyword=Java&location=India"

  - id: morgan_stanley
    enabled: false
    region: india
    company: Morgan Stanley
    note: HTML career site, no public API
    search_url: "https://www.morganstanley.com/careers/career-opportunities-search?keywords=Java"

  - id: deloitte
    enabled: true
    region: india
    company: Deloitte
    # India/South Asia only — never apply.deloitte.com (US board).
    rss_url: "https://southasiacareers.deloitte.com/services/rss/job/?locale=en_US&keywords=(Java)%20AND%20locationSearch:(India)"
    search_url: "https://southasiacareers.deloitte.com/search/?q=Java&locationsearch=India"
    max_pages: 8

  - id: pwc
    enabled: true
    region: india
    company: PwC
    keyword: Java
    workday:
      tenant: pwc
      shard: wd3
      site: Global_Experienced_Careers
      keyword: Java
      max_results: 500
      location_substr:
        - india
        - mumbai
        - bengaluru
        - bangalore
        - hyderabad
        - pune
        - chennai
        - gurgaon
        - gurugram
        - noida
        - kolkata
        - delhi
        - remote

  - id: ey
    enabled: true
    region: india
    company: EY
    rss_url: "https://careers.ey.com/services/rss/job/?locale=en_US&keywords=(Java)%20AND%20locationSearch:(India)"
    search_url: "https://careers.ey.com/ey/search/?q=Java&location=India"
    max_pages: 8

  - id: kpmg
    enabled: true
    region: india
    company: KPMG
    keyword: Java
    oracle:
      host: ejgk.fa.em2.oraclecloud.com
      sites:
        - CX_3001
        - CX_3

http:
  timeout_seconds: 30
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
  # Career CDNs sometimes break local trust stores on Windows.
  verify_ssl: false
