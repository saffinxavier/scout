<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Scout — Job listings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#results">Skip to listings</a>

  <main id="authScreen" class="auth-screen" aria-labelledby="authTitle">
    <div class="auth-card card">
      <div class="brand brand-auth">
        <div>
          <h1 id="authTitle">Scout</h1>
          <p class="sub">Java / Spring jobs · India · Europe · UAE · Infopark</p>
        </div>
      </div>
      <form id="loginForm" class="auth-form">
        <label class="field">
          Email
          <input id="loginEmail" type="email" name="email" required autocomplete="username" />
        </label>
        <label class="field">
          Password
          <input id="loginPassword" type="password" name="password" required minlength="8" autocomplete="current-password" />
        </label>
        <p id="loginError" class="field-error" role="alert" hidden></p>
        <button id="loginSubmit" class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>
    </div>
  </main>

  <div id="appShell" class="app-shell hidden">
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div>
            <h1>Scout</h1>
            <p class="sub">Java / Spring · India · Europe · UAE · Infopark</p>
          </div>
        </div>
        <div class="top-actions">
          <span id="userEmail" class="user-email"></span>
          <button id="signOutBtn" class="btn btn-ghost btn-icon" type="button" aria-label="Sign out">
            <svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            <span class="btn-text">Sign out</span>
          </button>
          <button id="scanBtn" class="btn btn-outline btn-icon" type="button" aria-label="Scan now">
            <span class="scan-spinner" aria-hidden="true"></span>
            <svg class="btn-ico scan-ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10" />
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
            </svg>
            <span class="scan-label btn-text">Scan now</span>
          </button>
        </div>
      </header>

      <div class="filter-bar">
        <button id="filterToggle" class="btn btn-ghost btn-icon filter-toggle" type="button" aria-expanded="false" aria-controls="filtersPanel" aria-label="Filters">
          <svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="6" x2="20" y2="6" />
            <line x1="8" y1="12" x2="16" y2="12" />
            <line x1="11" y1="18" x2="13" y2="18" />
          </svg>
          <span class="btn-text">Filters</span>
        </button>
        <div class="status-row">
          <p id="status" class="status" role="status"></p>
          <span id="nextScan" class="next-scan"></span>
          <button id="sourceInfoBtn" class="btn btn-ghost btn-icon source-info-btn" type="button" aria-label="Sources" aria-haspopup="dialog" aria-expanded="false">
            <svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="9" />
              <line x1="12" y1="11" x2="12" y2="16" />
              <circle cx="12" cy="8" r="0.75" fill="currentColor" stroke="none" />
            </svg>
            <span class="btn-text">Info</span>
            <span id="sourceInfoDot" class="info-dot hidden" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <dialog id="sourceDialog" class="source-dialog">
        <div class="source-dialog-head">
          <h2>Sources</h2>
          <button id="sourceDialogClose" class="btn btn-ghost btn-icon source-dialog-close" type="button" aria-label="Close">
            <svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="6" y1="6" x2="18" y2="18" />
              <line x1="18" y1="6" x2="6" y2="18" />
            </svg>
          </button>
        </div>
        <p id="sourceDialogScan" class="source-dialog-scan hidden"></p>
        <div id="sourceDialogBody" class="source-dialog-body"></div>
      </dialog>

      <div id="filterBackdrop" class="sheet-backdrop hidden" hidden></div>
      <section id="filtersPanel" class="filters" aria-label="Filters">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="filters-head">
          <h2 class="filters-title">Filters</h2>
          <button id="filterClose" class="btn btn-ghost filter-close" type="button">Close</button>
        </div>
        <div class="filters-body">
        <label class="field field-search">
          Search
          <input
            type="search"
            id="q"
            placeholder="Title or company"
            autocomplete="off"
          />
        </label>
        <label class="field">
          Region
          <select id="region">
            <option value="all">All</option>
            <option value="india">BIG4 & Banks</option>
            <option value="eu">Europe</option>
            <option value="uae">UAE</option>
            <option value="infopark">Infopark</option>
          </select>
        </label>
        <label class="field">
          Company
          <select id="company">
            <option value="all">All companies</option>
          </select>
        </label>
        <label class="field">
          Posted
          <select id="dateRange">
            <option value="all">Any time</option>
            <option value="24h" selected>Last 24 hours</option>
            <option value="48h">Last 48 hours</option>
            <option value="7d">Last 7 days</option>
            <option value="custom">Custom range</option>
          </select>
        </label>
        <label class="field">
          Status
          <select id="markFilter">
            <option value="open" selected>Open</option>
            <option value="new">New since last visit</option>
            <option value="applied">Applied</option>
            <option value="flagged">Flagged</option>
            <option value="hidden">Hidden</option>
            <option value="all">All</option>
          </select>
        </label>
        <label class="field custom-dates hidden" id="customWrap">
          <span class="custom-dates-label">Custom dates</span>
          <span class="custom-dates-row">
            <input type="date" id="dateFrom" aria-label="From date" />
            <input type="date" id="dateTo" aria-label="To date" />
          </span>
        </label>
        <label class="check">
          <input type="checkbox" id="includeUnknownDate" checked />
          Show jobs with unknown dates
        </label>
        </div>
        <div class="filters-foot">
          <button id="filterDone" class="btn btn-primary btn-block filter-done" type="button">Show results</button>
        </div>
      </section>

      <section id="errors" class="banner hidden" aria-live="polite"></section>

      <section id="results" class="results" aria-live="polite">
        <div class="empty-state" id="emptyState">
          <p>Loading listings…</p>
        </div>
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
